name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App tests
        run: npm test
      - name: Version was bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:version.js" > /tmp/base-version.js 2>/dev/null || echo "" > /tmp/base-version.js
          node scripts/check-version-bump.mjs /tmp/base-version.js
      - name: Push server tests
        working-directory: push-worker
        run: npm install --no-audit --no-fund && npm test

  e2e:
    name: iPhone end-to-end (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
            test-results/
          retention-days: 7
