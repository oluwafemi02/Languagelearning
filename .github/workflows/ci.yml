name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App tests
        run: npm test
      - name: Push server tests
        working-directory: push-worker
        run: npm install --no-audit --no-fund && npm test
